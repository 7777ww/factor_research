name: Daily Quant Portfolio Update

on:
  schedule:
    # Run everyday at 15:30 Taipei Time (07:30 UTC)
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install finlab pandas scipy matplotlib

      - name: Run daily update script
        env:
          FINLAB_API_TOKEN: ${{ secrets.FINLAB_TOKEN }}
        run: |
          python daily_update.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/index.html
          git commit -m "Auto-update daily portfolio dashboard" || exit 0
          git push
